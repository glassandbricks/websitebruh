<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Character Site</title>
    <style>
        /* Base Reset & Colors */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Comic Sans MS", "Chalkboard SE", "Arial", sans-serif;
        }

        body {
            background-color: #b2d932; 
            color: #333;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Content Layout Layout Grid */
        .main-wrapper {
            background-color: #ffffff;
            max-width: 960px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 250px 1fr;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Left Sidebar styling */
        .sidebar {
            background-color: #ffffff;
            padding: 30px 20px;
            border-right: 2px dotted #b2d932;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Requested Text Logo Variant */
        .main-logo {
            font-size: 28px;
            font-weight: 900;
            color: #000000;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .side-menu {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .side-menu a {
            font-size: 15px;
            color: #333333;
            padding-left: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .side-menu a:hover {
            color: #b2d932;
        }

        /* Fresh Badge Notification */
        .has-badge {
            position: relative;
        }

        .badge {
            background-color: #ff3366;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-right: 5px;
            text-transform: uppercase;
        }

        /* Ecards Button Style */
        .ecards-btn {
            background-color: #2da1d7;
            color: white;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }

        .ecards-btn span {
            display: block;
            font-size: 16px;
            text-transform: lowercase;
        }

        .ecards-btn strong {
            font-size: 22px;
            display: block;
        }

        /* Main Display Dashboard Area */
        .content-area {
            padding: 20px;
            background-color: #ffffff;
        }

        /* Top Hero Layout Area */
        .hero-banner {
            background: linear-gradient(180deg, #1fa2d6 0%, #60c5ef 100%);
            border-radius: 8px;
            height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            position: relative;
        }

        .banner-title {
            font-size: 42px;
            font-weight: bold;
            color: #000000;
            text-shadow: 2px 2px 0px #ffffff;
        }

        .hero-banner p {
            font-size: 18px;
            margin-top: 5px;
            letter-spacing: 2px;
        }

        /* Pink Sub Navigation Banner */
        .sub-ribbon {
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            margin: 15px 0;
        }

        .sub-ribbon a {
            color: #ed5297;
            font-weight: bold;
            font-size: 16px;
        }

        .sub-ribbon a:hover {
            text-decoration: underline;
        }

        /* Audio Player Container Box */
        .audio-box {
            background-color: #4caee3;
            border-radius: 6px;
            color: white;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .audio-header {
            background-color: #3598cb;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .audio-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .progress-bar {
            border-top: 2px dashed rgba(255,255,255,0.6);
            height: 1px;
            margin: 5px 0;
        }

        .controls {
            display: flex;
            justify-content: space-between;
        }

        .play-btn, .download-btn {
            background: none;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .site-url {
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Newsletter Registration Component */
        .newsletter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f7f9f0;
            padding: 12px;
            border-radius: 6px;
        }

        .newsletter-row label {
            color: #6d8223;
            font-weight: bold;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 5px;
        }

        .input-group input {
            padding: 6px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 200px;
        }

        .input-group button {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Bottom Footer Links Styling */
        .site-footer {
            max-width: 960px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .footer-col h3 {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.2);
        }

        .footer-col ul {
            list-style: none;
        }

        .footer-col li {
            margin-bottom: 5px;
        }

        .footer-col a {
            color: #e2f2b0;
            font-size: 12px;
        }

        .footer-col a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Mobile responsive configuration rules */
        @media(max-width: 768px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
            .sidebar {
                border-right: none;
                border-bottom: 2px dotted #b2d932;
            }
            .footer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
